name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1" # weekly, Monday 03:27 UTC

# Cancel superseded analyses on the same ref.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (Swift)
    # Swift analysis requires macOS and a real build.
    runs-on: macos-15
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift
          build-mode: manual

      # Model weights aren't in git; the app builds without them (E2E XCTSkips).
      - name: Build for analysis
        run: |
          set -o pipefail
          xcodegen generate
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          cands = [d['udid'] for rt, ds in devices.items() if 'iOS' in rt
                   for d in ds if d.get('isAvailable') and 'iPhone' in d['name']]
          print(cands[0])
          ")
          xcodebuild build \
            -project SoundView.xcodeproj \
            -scheme SoundView \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO

      # The analysis always runs; uploading results to the Security tab needs
      # code scanning enabled (free on public repos; GitHub Advanced Security on
      # private ones). Soft-fail the upload so the check stays green until then —
      # it activates automatically once code scanning is enabled. The Swift build
      # above still fails loudly on real compile breakage.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true
        with:
          category: "/language:swift"
