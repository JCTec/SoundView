name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build (e.g. v1.2.3)"
        required: true

# Create the GitHub Release.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build · sign · notarize · publish
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags for `git describe`

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install tools
        run: brew install xcodegen swiftlint xcbeautify ripgrep

      - name: Derive version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Release version: $V"

      - name: Determine signing availability
        id: signing
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
        run: |
          if [ -n "$MACOS_CERT_P12_BASE64" ]; then
            echo "mode=developer-id" >> "$GITHUB_OUTPUT"
          else
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify (gate — mirrors CI)
        env:
          SIGN_MODE: ${{ steps.signing.outputs.mode }}
        run: bash scripts/verify-release.sh

      - name: Build, sign, notarize, package DMG
        id: package
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          bash scripts/package-release.sh | tee package.out
          grep '^DMG=' package.out >> "$GITHUB_OUTPUT"
          grep '^SIGN_MODE=' package.out >> "$GITHUB_OUTPUT"

      - name: Assemble release notes
        id: notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SIGN_MODE: ${{ steps.package.outputs.SIGN_MODE }}
          DMG: ${{ steps.package.outputs.DMG }}
        run: |
          SHA=$(cut -d' ' -f1 "${DMG}.sha256")
          {
            echo "## SoundView ${VERSION}"
            echo
            if [ "$SIGN_MODE" = "developer-id" ]; then
              echo "Signed with Developer ID and notarized. Download, open the DMG, drag to Applications."
            else
              echo "> ⚠️ **Unsigned (ad-hoc) build** — not notarized. For testing only; Gatekeeper will block it on other Macs. Configure signing secrets for a distributable release (see HUMAN_CHECKLIST-GITHUB.md)."
            fi
            echo
            echo "**SHA-256** \`$SHA\`"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          SIGN_MODE: ${{ steps.package.outputs.SIGN_MODE }}
          DMG: ${{ steps.package.outputs.DMG }}
        run: |
          PRERELEASE=""
          [ "$SIGN_MODE" != "developer-id" ] && PRERELEASE="--prerelease"
          gh release create "$VERSION" \
            "$DMG" "${DMG}.sha256" \
            --title "SoundView $VERSION" \
            --notes-file RELEASE_NOTES.md \
            $PRERELEASE
