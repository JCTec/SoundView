name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build · Lint · Test
    runs-on: macos-15
    env:
      # Model weights aren't in git (GitHub Releases). The app builds and the
      # unit suite runs without them; the separation E2E XCTSkips when absent.
      SCHEME: SoundView

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Match the toolchain the app is developed/shipped with (Xcode 26.x /
          # Swift 6). An older Xcode SDK flags concurrency/exhaustiveness the modern
          # SDK doesn't, so CI must track the real build toolchain, not lag it.
          xcode-version: latest-stable

      - name: Show selected Xcode
        run: xcodebuild -version

      - name: Install XcodeGen + SwiftLint + xcbeautify
        run: brew install xcodegen swiftlint xcbeautify

      - name: Generate project
        run: xcodegen generate

      - name: SwiftLint
        run: swiftlint lint --reporter github-actions-logging

      - name: Pick an available iOS simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          candidates = [d['udid'] for runtime, ds in devices.items() if 'iOS' in runtime
                        for d in ds if d.get('isAvailable') and 'iPhone' in d['name']]
          print(candidates[0])
          ")
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build & test (unit + integration)
        run: |
          set -o pipefail
          xcodebuild test \
            -project SoundView.xcodeproj \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:SoundViewTests \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
