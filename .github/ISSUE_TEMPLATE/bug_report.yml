name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report! Please fill in what you can — details help a lot.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: Steps to reproduce → expected → actual
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Separation (Demucs / Core ML)
        - Playback / mixing
        - Import / library / recording
        - Export
        - UI / layout
        - Build / tooling / CI
        - Other
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform & OS
      placeholder: "iPhone 15 Pro · iOS 17.5  /  Mac · macOS 14.5"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version / commit
      placeholder: "2.0.0 (1) or git SHA"
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Console output, a screen recording, or a crash log if you have one.
      render: shell
