version: 2
updates:
  # Keep the GitHub Actions used in CI/CD up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"

  # Python tooling used to convert Demucs → Core ML (build-time only).
  - package-ecosystem: "pip"
    directory: "/tools"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "tools"
    labels:
      - "dependencies"
      - "tools"
