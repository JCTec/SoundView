disabled_rules:
  - trailing_whitespace
  - todo
opt_in_rules:
  - empty_count
  - explicit_init
  - fatal_error_message
  - first_where
  - overridden_super_call
  - private_action
  - redundant_nil_coalescing
  - vertical_whitespace_closing_braces
  - sorted_imports
line_length:
  warning: 120
  error: 150
type_body_length:
  warning: 300
  error: 400
file_length:
  warning: 400
  error: 600
function_body_length:
  warning: 50
  error: 80
identifier_name:
  min_length: 2
  excluded:
    - id
    - x
    - y
    - sr
    - n
type_name:
  min_length: 2
  excluded:
    - SV
excluded:
  - SoundViewTests
  - SoundViewUITests
  - .derivedData
  - DerivedData
  - tools
